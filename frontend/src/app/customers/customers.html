  <ng-container *ngIf="customers | async as ListCustomers; else failureOrLoading">
      <div class="card">
        <div class="card-header">Customers</div>
        <div class="card-body">
          @if (searchFormGroup){
          <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchCustomers()">
            <div class="input-group">
              <label class="input-group-text"> Keyword :</label>
              <input type="text" formControlName="keyword" class="form-control">
              <button class="btn btn-outline-info">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>}
          <table class="table">
            <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Email</th>
            </tr>
            </thead>
            <tbody>
              @for (c of customers | async; track c){
                <tr>
                  <td>{{c.id}}</td>
                  <td>{{c.name}}</td>
                  <td>{{c.email}}</td>
                  <td>
<!--                    <button (click)="handleDeleteCustomer(c)" class="btn" style="background-color:#ff80aa;">-->
<!--                      <i class="bi bi-trash" style="color:#1a0000;"></i>-->
<!--                    </button>-->
                    <button
                      (click)="handleDeleteCustomer(c)" class="btn border-0 shadow-sm d-flex align-items-center justify-content-center"
                      style="background-color: #ff80aa; border-radius: 12px;"
                      onmouseover="this.style.backgroundColor='#ff5c93'; this.style.transform='scale(1.08)'"
                      onmouseout="this.style.backgroundColor='#ff80aa'; this.style.transform='scale(1)'">
                      <i class="bi bi-trash-fill" style="color: #262673;"></i>
                    </button>
                  </td>
                  <td>
                    <button
                      (click)="handleCustomerAccounts(c)" class="btn border-0 shadow-sm d-flex align-items-center justify-content-center"
                      style="background-color: #029df6; border-radius: 12px;"
                      onmouseover="this.style.backgroundColor='#017ec1'; this.style.transform='scale(1.08)'"
                      onmouseout="this.style.backgroundColor='#2ca5f4'; this.style.transform='scale(1)'">
                      <h5 style="color: rgba(49,1,89,0.73);">Accounts</h5>
                    </button>
                  </td>
                </tr>}
            </tbody>
          </table>
        </div>
      </div>
  </ng-container>
  <ng-template #failureOrLoading>
    <ng-container *ngIf="errorMessage; else loading">
      <div class="text-danger">
        {{errorMessage}}
      </div>
    </ng-container>
    <ng-template #loading>
      Loading ........
    </ng-template>
  </ng-template>
</div>

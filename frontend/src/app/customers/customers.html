<div class="container mt-2">
  @if (customers){
  <div class="card">
    <div class="card-header">Customers</div>
    <div class="card-body">
      <table class="table">
        <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Email</th>
        </tr>
        </thead>
        <tbody>
          @for (c of customers; track c){
        <tr>
          <td>{{c.id}}</td>
          <td>{{c.name}}</td>
          <td>{{c.email}}</td>
        </tr>}
        </tbody>
      </table>
    </div>
  </div>}
</div>
